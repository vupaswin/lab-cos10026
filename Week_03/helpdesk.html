<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta tag for character encoding -->
    <meta charset="utf-8">
    <!-- Meta tag for page description -->
    <meta name="description" content="Helpdesk Request Form">
    <!-- Meta tag for search engine keywords -->
    <meta name="keywords" content="HTML, CSS, JavaScript, Helpdesk, Support">
    <!-- Meta tag for author -->
    <meta name="author" content="ANH VU Pham">
    <!-- Meta tag for responsive viewport on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page Title -->
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <!-- 1. Swinburne Logo with Hyperlink to http://www.swin.edu.au -->
    <p>
        <a href="http://www.swin.edu.au">
            <img src="swin_logo.png" alt="Swinburne University of Technology Logo">
        </a>
    </p>

    <!-- 2. Heading 1 -->
    <h1>CWA Help Desk Appointment</h1>

    <!-- 3. Informational Paragraphs -->
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <!-- 4. Help Desk Form -->
    <form method="post" id="SurveyForm" action="http://mercury.swin.edu.au/it000000/formtest.php">

        <!-- 5. Fieldset: Student details -->
        <fieldset>
            <legend>Student details</legend>

            <!-- Student ID: linked with 'for', required, pattern: 7-10 digits -->
            <p>
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required="required" pattern="[0-9]{7,10}" title="Student ID must be between 7 and 10 digits">
            </p>

            <!-- Given Name & Family Name: linked with 'for', required, max 15 characters, letters only -->
            <p>
                <label for="given_name">Given Name</label>
                <input type="text" id="given_name" name="given_name" maxlength="15" pattern="[a-zA-Z]+" required="required" title="Given name must only contain letters, up to 15 characters">

                <label for="family_name">Family Name</label>
                <input type="text" id="family_name" name="family_name" maxlength="15" pattern="[a-zA-Z]+" required="required" title="Family name must only contain letters, up to 15 characters">
            </p>
        </fieldset>

        <!-- 6. Fieldset: Your unit -->
        <fieldset>
            <legend>Your unit</legend>

            <!-- Radio buttons for unit selection: at least one set to required="required" -->
            <input type="radio" id="cos10011" name="unit" value="COS10011" required="required">
            <label for="cos10011">COS10011</label>

            <input type="radio" id="cos60004" name="unit" value="COS60004">
            <label for="cos60004">COS60004</label>

            <input type="radio" id="cos60007" name="unit" value="COS60007">
            <label for="cos60007">COS60007</label>

            <!-- 7. Your Tutor Dropdown: required, first option value is empty string "" -->
            <p>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" required="required">
                    <!-- Hidden select to make the dropdown required, it will not be submitted with the form-->
                    <option value="" hidden>Please Select</option>
                    <option value="Trung Doan">Trung Doan</option>
                    <option value="Nghia Quach">Nghia Quach</option>
                    <option value="Le Tran">Le Tran</option>
                </select>
            </p>
        </fieldset>



        <!-- 8. Fieldset: Issue -->
        <fieldset>
            <legend>Issue</legend>

            <!-- Checkboxes: HTML ticked/checked by default -->
            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">

                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="issue[]" value="CSS">

                <label for="js">JavaScript</label>
                <input type="checkbox" id="js" name="issue[]" value="JavaScript">

                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="issue[]" value="PHP">

                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="issue[]" value="MySQL">
            </p>

            <!-- Description of Issue: textarea with placeholder attribute -->
            <p>
                <label for="issue_desc">Description of Issue</label><br>
                <textarea id="issue_desc" name="issue_desc" rows="4" cols="45" placeholder="Write description of your problem here..."></textarea>
            </p>
        </fieldset>

        <!-- 9. Fieldset: Preferred Date / Time -->
        <!-- Requirement: type="text", placeholders "dd/mm/yyyy" & "00:00", patterns to match placeholders -->
        <fieldset>
            <legend>Preferred Date / Time</legend>

            <!-- Date input: text type with placeholder and pattern \d{2}/\d{2}/\d{4} -->
            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="Please enter date in format dd/mm/yyyy">
            </p>

            <!-- Time input: text type with placeholder and pattern \d{2}:\d{2} -->
            <p>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" pattern="\d{2}:\d{2}" title="Please enter time in format 00:00">
            </p>
        </fieldset>

        <!-- 10. Form Action Buttons: Submit (Book) and Reset (Reset form) -->
        <p>
            <input type="submit" value="Book">
            <input type="reset" value="Reset form">
        </p>

    </form>
</body>

</html>
